# GitHub Pages deployment for the Auto-Research deck.
name: Deploy Auto-Research presentation to Pages

on:
  push:
    branches: [main]
    paths:
      - 'oliver/auto_research_beamer_package/web-presentation/github-pages/**'
      - '.github/workflows/auto-research-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: oliver/auto_research_beamer_package/web-presentation/github-pages
      # One earlier deployment timed out while GitHub still reported updating_pages.
      # Cancel it and wait for the Pages API to confirm that the lock is gone.
      - name: Clear stale Pages deployment lock
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          pages_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/c72a551ea812dcb8426db0bb5b7270972002be11"
          cancel_code="$(curl --silent --show-error --location --request POST \
            --output /tmp/pages-cancel.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "${pages_api}/cancel")"
          echo "Cancel request returned HTTP ${cancel_code}."
          if [[ -s /tmp/pages-cancel.json ]]; then cat /tmp/pages-cancel.json; fi

          for attempt in $(seq 1 48); do
            status_code="$(curl --silent --show-error --location \
              --output /tmp/pages-status.json --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${pages_api}")"
            status="$(jq -r '.status // "unknown"' /tmp/pages-status.json 2>/dev/null || echo unknown)"
            echo "Lock check ${attempt}: HTTP ${status_code}, status ${status}."
            if [[ "${status_code}" == "404" || ("${status_code}" == "200" && "${status}" != "updating_pages" && "${status}" != "deployment_queued") ]]; then
              delete_code="$(curl --silent --show-error --location --request DELETE \
                --output /tmp/deployment-delete.json --write-out '%{http_code}' \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/6128081487")"
              echo "Stale deployment record deletion returned HTTP ${delete_code}."
              if [[ -s /tmp/deployment-delete.json ]]; then cat /tmp/deployment-delete.json; fi
              [[ "${delete_code}" == "204" || "${delete_code}" == "404" ]] || exit 1
              sleep 15
              exit 0
            fi
            sleep 5
          done

          echo "The stale Pages deployment lock did not clear in time."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
